version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_conteneur
    ports:
      - "27017:27017" # Expose le port pour l'inspecter avec Compass
    volumes:
      - db_data:/data/db # VOLUME 1 : Base de données

  migration_app:
    build: .
    container_name: python_migration
    depends_on:
      - mongodb
    volumes:
      - ./:/app # VOLUME 2 : Dossier local vers le conteneur

volumes:
  db_data: # Déclaration du volume persistant